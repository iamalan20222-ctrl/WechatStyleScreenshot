name: macOS

on:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WechatStyleScreenshot-macOS
          path: macos/dist/**

